# HOI4D action sequences (preprocessed with data/datasets/hoi4d_preprocess.py).
# Used only by scripts/target_coverage.py for the HOI4D target-coverage statistic.
seed: 0
out_dir: runs/hoi4d_action_point4d
device: cuda
data:
  name: hoi4d
  root: datasets/hoi4d_npz
  num_frames: 24
  num_points: 2048
  horizons: [0, 4, 8]
encoder:
  name: point4d
  embed_dim: 256
  depth: 4
  num_heads: 4
teacher:
  name: vjepa2
loss:
  vicreg: 1.0
optim:
  epochs: 120
  batch_size: 16
  base_lr: 0.0005
  num_workers: 8
