# MSR-Action3D, Point4D student, DINOv2-large teacher: the headline configuration.
# Dense by default; --global gives the per-clip global-distillation baseline, and
# --teacher {dinov3,vjepa2,videomaev2,vit-in1k,vit-rand,rawpix} swaps the teacher
# (Tables 1-4 and 6). Clips are resampled to 28 frames and the first 24 are used
# (horizons [4]); configs/msr_point4d_resample32.yaml is the 32-frame variant.
seed: 0
out_dir: runs/msr_point4d
device: cuda
data:
  name: msr_action3d
  root: datasets/MSRAction3D
  num_frames: 24
  num_points: 2048
  horizons: [4]
encoder:
  name: point4d
  embed_dim: 256
  depth: 4
  num_heads: 4
  npoints: [256, 64]
  ks: [32, 16]
teacher:
  name: dinov2
loss:
  vicreg: 1.0
optim:
  epochs: 100
  batch_size: 16
  base_lr: 0.0005
  num_workers: 8
