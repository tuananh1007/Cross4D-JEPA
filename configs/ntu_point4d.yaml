# NTU RGB+D 60 (Cross-Subject), Point4D student (Table 1).
# Targets are held in memory (~38 MB/clip), so pretrain with --max-clips 1000 (the
# Table 1 protocol) or use --token-cache --target-cache-dir for the full split.
# The Table 1 NTU row was trained with the V-JEPA 2 teacher set here; pass
# --teacher dinov2 for the DINOv2 teacher.
seed: 0
out_dir: runs/ntu_point4d
device: cuda
data:
  name: ntu_rgbd60
  root: datasets/ntu_npz
  num_frames: 24
  num_points: 2048
  horizons: [0, 4, 8]
encoder:
  name: point4d
  embed_dim: 256
  depth: 4
  num_heads: 4
teacher:
  name: vjepa2
loss:
  vicreg: 1.0
optim:
  epochs: 100
  batch_size: 16
  base_lr: 0.0005
  num_workers: 8
