# Granularity axis WITHIN Point4D: token granularity npoints[1]=16 (kNN group ks[1]=64).
# ks[1] is scaled inversely so point coverage (n2*k2) stays ~constant and only token
# LOCALITY varies (n2=64 is configs/msr_point4d.yaml; n2=1 is a pooling backbone).
# Run under both dense (default) and global (--global) supervision (Table 4).
seed: 0
out_dir: runs/gran_n16
device: cuda
data:
  name: msr_action3d
  root: datasets/MSRAction3D
  num_frames: 24
  num_points: 2048
  horizons: [4]
encoder:
  name: point4d
  embed_dim: 256
  depth: 4
  num_heads: 4
  npoints: [256, 16]
  ks: [32, 64]
teacher:
  name: dinov2
loss:
  vicreg: 1.0
optim:
  epochs: 100
  batch_size: 16
  base_lr: 0.0005
  num_workers: 8
