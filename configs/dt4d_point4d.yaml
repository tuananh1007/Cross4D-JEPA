# DeformingThings4D-Animals, Point4D student (Table 1).
# The Table 1 DeformingThings4D row was trained with the V-JEPA 2 teacher set here;
# pass --teacher dinov2 for the DINOv2 teacher.
seed: 0
out_dir: runs/dt4d_point4d
device: cuda
data:
  name: dt4d_animals
  root: datasets/DeformingThings4D
  num_frames: 16
  num_points: 2048
  horizons: [0, 4, 8]
encoder:
  name: point4d
  embed_dim: 256
  depth: 4
  num_heads: 4
teacher:
  name: vjepa2
loss:
  vicreg: 1.0
optim:
  epochs: 60
  batch_size: 16
  base_lr: 0.0005
  num_workers: 8
