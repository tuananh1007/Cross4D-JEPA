# MSR-Action3D, Point4D student: identical to msr_point4d.yaml except that clips are
# resampled to 32 frames before the first 24 are used (horizons [0, 4, 8]). This is
# the setting of the Table 6 SSL baselines, the Table 5 zero-shot MSR encoders, the
# fine-tuning runs and the random-init MSR probe.
seed: 0
out_dir: runs/msr_point4d_resample32
device: cuda
data:
  name: msr_action3d
  root: datasets/MSRAction3D
  num_frames: 24
  num_points: 2048
  horizons: [0, 4, 8]
encoder:
  name: point4d
  embed_dim: 256
  depth: 4
  num_heads: 4
  npoints: [256, 64]
  ks: [32, 16]
teacher:
  name: dinov2
loss:
  vicreg: 1.0
optim:
  epochs: 100
  batch_size: 16
  base_lr: 0.0005
  num_workers: 8
